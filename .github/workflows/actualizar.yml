name: Actualizar Ofertas MeLi

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Guardar y subir cambios al sitio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Bot Cazaofertas"
          git config --global user.email "bot@users.noreply.github.com"
          git add ofertas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática [skip ci]" && git push)
